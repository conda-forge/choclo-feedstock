{% set name = "choclo" %}
{% set version = "0.4.0" %}
{% set python_min = "3.11" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/choclo-{{ version }}.tar.gz
  sha256: 83ed653790fa942e88fb8522147df0e6bde3ee5d3eeb01e35ba9be44f254bd79

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools >=61
    - setuptools_scm >=8.0.3
  run:
    - python >={{ python_min }}
    - numpy >=1.26
    - numba >=0.59

test:
  imports:
    - choclo
  commands:
    - pip check
  requires:
    - python {{ python_min }}
    - pip

about:
  home: https://github.com/fatiando/choclo
  license: BSD-3-Clause
  license_family: BSD
  license_file: LICENSE.txt
  summary: Kernel functions for your geophysical models
  description: |
    Choclo is a Python library that hosts optimized forward modelling and
    kernel functions for running geophysical forward and inverse models,
    intended to be used by other libraries as the underlying layer of their
    computation.
  doc_url: https://www.fatiando.org/choclo
  dev_url: https://github.com/fatiando/choclo

extra:
  recipe-maintainers:
    - santisoler
    - leouieda
